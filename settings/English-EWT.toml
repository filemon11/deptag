[deptag]
[deptag.deprels]
arguments = [ "nsubj", "obj", "iobj", "csubj", "ccomp", "xcomp" ]
adjuncts = [ "fixed", "obl", "expl", "vocative", "dislocated", "advcl", "advmod", "discourse", "aux", "cop", "mark", "nmod", "appos", "nummod", "acl", "amod", "det", "case", "conj", "cc", "flat", "list", "parataxis", "compound", "orphan", "goeswith", "reparandum", "punct", "dep" ]
delete = [ "root" ]

labelled = true
subtypes = false
order_relations = true

[deptag.deprels.merged]
subj = [ "nsubj", "csubj" ]
# obj = [ "obj", "iobj"]
# comp = [ "ccomp", "xcomp" ]
mod = [ "advmod", "advcl", "nmod", "nummod", "amod", "acl" ]
# other = [ "discourse", "reparandum", "punct", "goeswith", "parataxis"]

[deptag.file]
conllu_file = "English-EWT"
split = "train"
output_file = "English-EWT-tagged"
standard_from_xml = true

[deptag.tagging]
batch_size = 32
grad_acc = 8
model_name = "xlm-roberta-large"
model_path = "FacebookAI/xlm-roberta-large"
lr = 1e-5
epochs = 500
eval_model_name = "English-EWT-xlm-roberta-large-1e-05-500"
train_arc = true
train_deprel = true
train_sup = true
# mode = "continue"
eval_metric = "a*-las"
